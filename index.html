<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .clickable-row { cursor: pointer; transition: background-color 0.2s, border-color 0.2s; border-bottom: 1px solid #f1f5f9; }
        .clickable-row:hover { background-color: #f8fafc; }
        .expanded-row { background-color: #f8fafc; border-bottom-color: transparent !important; }
        /* Smooth expand transition */
        .detail-row td { padding: 0 !important; border: none; }
        .detail-content { 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.4s ease-out, opacity 0.3s ease;
            opacity: 0;
            background-color: #f8fafc;
        }
        .detail-content.expanded { 
            max-height: 2000px; 
            opacity: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .chevron-icon { transition: transform 0.3s ease; }
        .expanded-row .chevron-icon { transform: rotate(180deg); }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8 min-h-screen text-slate-800">
    <div class="max-w-7xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-bold flex items-center gap-3">
                <i class="fa-solid fa-chart-pie text-blue-600"></i>
                Portfolio Summary
            </h1>
            <div class="text-sm text-slate-500 bg-white px-4 py-2 rounded-full shadow-sm">
                <i class="fa-solid fa-circle-check text-green-500 mr-1"></i> Live Data Sync
            </div>
        </div>
        
        <!-- Summary Dashboard -->
        <div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden mb-8">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse whitespace-nowrap" id="summaryTable">
                    <thead>
                        <tr class="bg-slate-800 text-slate-100 uppercase text-xs font-semibold tracking-wider">
                            <th class="p-4 text-left rounded-tl-lg">Asset (Key)</th>
                            <th class="p-4 text-center">Rank</th>
                            <th class="p-4">Investment ($)</th>
                            <th class="p-4">Cash-out ($)</th>
                            <th class="p-4">Pending ($)</th>
                            <th class="p-4">TOTAL REVENUE ($)</th>
                            <th class="p-4">NET PROFIT ($)</th>
                            <th class="p-4 rounded-tr-lg">ROI (%)</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm font-medium" id="summaryBody">
                        <tr><td colspan="8" class="p-4 text-center text-slate-500">Đang tải dữ liệu...</td></tr>
                    </tbody>
                    <tfoot class="bg-slate-50 font-bold text-slate-900 border-t-2 border-slate-300" id="summaryFooter">
                        <!-- Total row injected here -->
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = '1wyXOB7wktDBG1BeNn_YEiHL4d63R1lKcAoHxcP2hJF8';
        const GID = '0';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}`; 

        // CẤU HÌNH VỐN ĐẦU TƯ CHO TỪNG COIN (Investment)
        const INVESTMENTS = {
            'BTC': 18000,
            'ETH': 18000,
            'ENA': 14000,
            'AVAX': 15000,
            'LINK': 11000,
            'SUI': 1000
        };

        // MAPPING KÝ HIỆU COIN SANG ID COINGECKO
        const COINGECKO_MAP = {
            'BTC': 'bitcoin',
            'ETH': 'ethereum',
            'ENA': 'ethena',
            'AVAX': 'avalanche-2',
            'LINK': 'chainlink',
            'SUI': 'sui'
        };

        let globalData = []; 
        let liveData = {}; // Store price and rank

        async function initDashboard() {
            try {
                // Lấy giá Live và Rank từ CoinGecko (vì Binance không có Rank)
                const ids = Object.values(COINGECKO_MAP).join(',');
                const url = `https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}`;
                const res = await fetch(url);
                const tickerData = await res.json();
                
                // Map lại vào object theo symbol gốc
                tickerData.forEach(item => {
                    const symbol = Object.keys(COINGECKO_MAP).find(key => COINGECKO_MAP[key] === item.id);
                    if (symbol) {
                        liveData[symbol] = {
                            price: parseFloat(item.current_price),
                            rank: item.market_cap_rank
                        };
                    }
                });
            } catch (err) {
                console.warn("Không thể tải giá live & rank từ CoinGecko:", err);
            }

            // Parse Google Sheet CSV sau khi có giá & rank
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    if(data && data.length > 0) {
                        globalData = data.filter(row => Object.values(row).some(val => val && val.trim() !== ''));
                        processSummary(globalData);
                    } else {
                        document.getElementById('summaryBody').innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500">Không có dữ liệu</td></tr>`;
                    }
                },
                error: function(err) {
                    document.getElementById('summaryBody').innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500">Lỗi khi tải dữ liệu: ${err.message}</td></tr>`;
                }
            });
        }

        function formatMoney(amount, forceDecimals = false) {
            if (amount === undefined || amount === null) return '-';
            const options = { minimumFractionDigits: 0, maximumFractionDigits: 4 };
            if (forceDecimals && amount < 10) options.minimumFractionDigits = 2; // Show decimals for small prices
            return '$' + amount.toLocaleString('en-US', options);
        }

        function parseMoney(str) {
            if (!str) return 0;
            return parseFloat(str.replace(/[\$\,]/g, '')) || 0;
        }

        function getStatusBadge(statusText) {
            if (!statusText) return '-';
            if (statusText.includes('Filled')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800 border border-green-200">${statusText}</span>`;
            } else if (statusText.includes('Pending')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-amber-100 text-amber-800 border border-amber-200">${statusText}</span>`;
            }
            return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-200 text-slate-800">${statusText}</span>`;
        }

        function processSummary(data) {
            const summary = {};

            data.forEach(row => {
                const coin = row['COIN'] ? row['COIN'].trim() : null;
                if (!coin) return;

                if (!summary[coin]) {
                    summary[coin] = {
                        asset: coin,
                        rank: liveData[coin] ? liveData[coin].rank : 9999, // default to high rank if not found
                        investment: INVESTMENTS[coin] || 0,
                        cashOut: 0,
                        pending: 0,
                        details: []
                    };
                }

                summary[coin].details.push(row);

                // --- LOGIC TÍNH TỔNG CỘT AMOUNT THEO STATUS ---
                const amount = parseMoney(row['AMOUNT']);
                const status = row['STATUS'] || '';

                if (status.includes('Filled')) {
                    summary[coin].cashOut += amount;
                } else if (status.includes('Pending')) {
                    summary[coin].pending += amount;
                }
            });

            let totalInvestment = 0;
            let totalCashOut = 0;
            let totalPending = 0;
            let totalRevenueSum = 0;
            let totalNetProfit = 0;

            const summaryList = Object.values(summary).map(item => {
                // Total Revenue = Cash-Out + Pending
                item.totalRevenue = item.cashOut + item.pending;
                item.netProfit = item.totalRevenue - item.investment;
                item.roi = item.investment > 0 ? (item.netProfit / item.investment) : 0;

                totalInvestment += item.investment;
                totalCashOut += item.cashOut;
                totalPending += item.pending;
                totalRevenueSum += item.totalRevenue;
                totalNetProfit += item.netProfit;

                return item;
            });
            
            // SẮP XẾP THEO RANK (Tăng dần)
            summaryList.sort((a, b) => a.rank - b.rank);

            const totalROI = totalInvestment > 0 ? (totalNetProfit / totalInvestment) : 0;

            renderSummary(summaryList, {
                totalInvestment, totalCashOut, totalPending, totalRevenueSum, totalNetProfit, totalROI
            });
        }

        function toggleRow(coinId) {
            const mainRow = document.getElementById(`row-${coinId}`);
            const detailWrapper = document.getElementById(`wrapper-${coinId}`);
            
            if (mainRow.classList.contains('expanded-row')) {
                mainRow.classList.remove('expanded-row');
                detailWrapper.classList.remove('expanded');
            } else {
                // Tự động đóng các accordion khác (tuỳ chọn)
                document.querySelectorAll('.expanded-row').forEach(row => row.classList.remove('expanded-row'));
                document.querySelectorAll('.detail-content').forEach(wrapper => wrapper.classList.remove('expanded'));
                
                mainRow.classList.add('expanded-row');
                detailWrapper.classList.add('expanded');
            }
        }

        function renderSummary(summaryList, totals) {
            const tbody = document.getElementById('summaryBody');
            const tfoot = document.getElementById('summaryFooter');
            tbody.innerHTML = '';

            summaryList.forEach((item, index) => {
                const coinId = item.asset.replace(/\s+/g, '-');
                
                // --- 1. Hàng Summary (Main Row) ---
                const tr = document.createElement('tr');
                tr.className = 'clickable-row group';
                tr.id = `row-${coinId}`;
                tr.onclick = () => toggleRow(coinId);
                
                tr.innerHTML = `
                    <td class="p-4 text-left font-bold text-blue-600 group-hover:text-blue-800 flex items-center gap-3">
                        <i class="fa-solid fa-chevron-down text-slate-400 text-[10px] chevron-icon"></i>
                        ${item.asset}
                    </td>
                    <td class="p-4 text-center text-slate-500 font-mono text-xs">${item.rank !== 9999 ? '#' + item.rank : '-'}</td>
                    <td class="p-4 text-slate-600">${formatMoney(item.investment)}</td>
                    <td class="p-4 font-semibold text-green-600">${formatMoney(item.cashOut)}</td>
                    <td class="p-4 font-semibold text-amber-500">${formatMoney(item.pending)}</td>
                    <td class="p-4 font-bold text-slate-800">${formatMoney(item.totalRevenue)}</td>
                    <td class="p-4 font-bold ${item.netProfit >= 0 ? 'text-green-600' : 'text-red-500'}">${formatMoney(item.netProfit)}</td>
                    <td class="p-4 font-bold ${item.roi >= 0 ? 'text-green-600' : 'text-red-500'}">${(item.roi * 100).toFixed(0)}%</td>
                `;
                tbody.appendChild(tr);

                // --- 2. Hàng Detail (Dropdown Row) ---
                const currentPrice = liveData[item.asset] ? liveData[item.asset].price : null;
                
                let detailHtml = `
                    <div class="pl-8 pr-4 pb-6 pt-2">
                        <table class="w-full text-left border-collapse whitespace-nowrap bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                            <thead>
                                <tr class="bg-slate-100/80 text-slate-500 uppercase text-[11px] font-bold tracking-wider">
                                    <th class="py-2.5 px-4 border-b border-slate-200">Status</th>
                                    <th class="py-2.5 px-4 border-b border-slate-200">Phase</th>
                                    <th class="py-2.5 px-4 border-b border-slate-200">Rationale</th>
                                    <th class="py-2.5 px-4 border-b border-slate-200 text-right text-blue-600 bg-blue-50/50">Live Price</th>
                                    <th class="py-2.5 px-4 border-b border-slate-200 text-right">Target $</th>
                                    <th class="py-2.5 px-4 border-b border-slate-200 text-right">Quantity</th>
                                    <th class="py-2.5 px-4 border-b border-slate-200 text-right">Ratio</th>
                                    <th class="py-2.5 px-4 border-b border-slate-200 text-right text-slate-700">Amount</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm divide-y divide-slate-100">
                `;
                
                item.details.forEach(detail => {
                    // Logic màu sắc so sánh giá
                    const targetVal = parseMoney(detail['TARGET $']);
                    let priceColorClass = 'text-blue-600';
                    if (currentPrice && targetVal > 0) {
                        const diff = (currentPrice - targetVal) / targetVal;
                        // Nổi bật nếu giá Live sát Target (cách 5%)
                        if (diff >= -0.05 && diff <= 0) {
                            priceColorClass = 'text-green-500 font-bold';
                        }
                    }

                    detailHtml += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="py-2.5 px-4">${getStatusBadge(detail['STATUS'])}</td>
                            <td class="py-2.5 px-4 text-slate-600 font-medium">${detail['PHASE'] || '-'}</td>
                            <td class="py-2.5 px-4 text-slate-500 text-xs">${detail['PRICING RATIONALE'] || '-'}</td>
                            <td class="py-2.5 px-4 text-right font-medium ${priceColorClass} bg-blue-50/20">${formatMoney(currentPrice, true)}</td>
                            <td class="py-2.5 px-4 text-right font-medium text-slate-700">${detail['TARGET $'] || '-'}</td>
                            <td class="py-2.5 px-4 text-right text-slate-500">${detail['QUANTITY'] || '-'}</td>
                            <td class="py-2.5 px-4 text-right text-slate-500">${detail['RATIO'] || '-'}</td>
                            <td class="py-2.5 px-4 text-right font-bold text-slate-800">${detail['AMOUNT'] || '-'}</td>
                        </tr>
                    `;
                });
                
                detailHtml += `</tbody></table></div>`;

                const detailTr = document.createElement('tr');
                detailTr.className = 'detail-row';
                detailTr.innerHTML = `
                    <td colspan="8">
                        <div id="wrapper-${coinId}" class="detail-content">
                            ${detailHtml}
                        </div>
                    </td>
                `;
                
                tbody.appendChild(detailTr);
            });

            // --- 3. Tfoot Total ---
            tfoot.innerHTML = `
                <tr>
                    <td class="p-4 text-left text-lg">TOTAL</td>
                    <td class="p-4 text-center">-</td>
                    <td class="p-4">${formatMoney(totals.totalInvestment)}</td>
                    <td class="p-4">${formatMoney(totals.totalCashOut)}</td>
                    <td class="p-4">${formatMoney(totals.totalPending)}</td>
                    <td class="p-4">${formatMoney(totals.totalRevenueSum)}</td>
                    <td class="p-4 ${totals.totalNetProfit >= 0 ? 'text-green-600' : 'text-red-500'}">${formatMoney(totals.totalNetProfit)}</td>
                    <td class="p-4 ${totals.totalROI >= 0 ? 'text-green-600' : 'text-red-500'}">${(totals.totalROI * 100).toFixed(0)}%</td>
                </tr>
            `;
        }
        
        // Khởi chạy
        initDashboard();
    </script>
</body>
</html>
