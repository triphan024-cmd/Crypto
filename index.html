<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .clickable-row { cursor: pointer; transition: background-color 0.2s, border-color 0.2s; border-bottom: 1px solid #f1f5f9; }
        .clickable-row:hover { background-color: #f8fafc; }
        .expanded-row { background-color: #f8fafc; border-bottom-color: transparent !important; }
        
        .detail-row {
            background-color: #f8fafc;
            border-bottom: 1px solid #f1f5f9;
        }
        .detail-row td { padding-top: 0.75rem !important; padding-bottom: 0.75rem !important; }
        .detail-row.hidden-row { display: none !important; }
        
        .chevron-icon { transition: transform 0.3s ease; }
        .expanded-row .chevron-icon { transform: rotate(180deg); }
        
        /* Mobile Responsive Table Styles */
        @media (max-width: 767px) {
            .responsive-table table, .responsive-table thead, .responsive-table tbody, .responsive-table th, .responsive-table td, .responsive-table tr { 
                display: block; 
            }
            .responsive-table thead tr { 
                position: absolute; top: -9999px; left: -9999px; 
            }
            .responsive-table tr { 
                border: 1px solid #e2e8f0; border-radius: 0.75rem; margin-bottom: 1rem; background: white; overflow: hidden; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            }
            .responsive-table td { 
                border: none; border-bottom: 1px solid #f1f5f9; position: relative; padding-left: 50% !important; text-align: right !important; min-height: 3.5rem; display: flex; align-items: center; justify-content: flex-end;
            }
            .responsive-table td:last-child { border-bottom: 0; }
            .responsive-table td:before { 
                position: absolute; top: 50%; left: 1rem; transform: translateY(-50%); width: 45%; white-space: nowrap; text-align: left; font-weight: 600; color: #64748b; font-size: 0.75rem; text-transform: uppercase; content: attr(data-label); 
            }
            
            /* Exceptions for detail rows on mobile */
            .responsive-table tr.detail-row { 
                border: 1px dashed #cbd5e1; margin-top: -0.5rem; margin-left: 1rem; margin-right: 1rem; border-radius: 0.5rem; box-shadow: none; background: #f8fafc;
            }
            .responsive-table tr.detail-row.hidden-row { display: none !important; }
            
            .clickable-row { border-bottom: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8 min-h-screen text-slate-800">
    <div class="max-w-7xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-bold flex items-center gap-3">
                <i class="fa-solid fa-chart-pie text-blue-600"></i>
                Portfolio Summary
            </h1>
            <div class="text-sm text-slate-500 bg-white px-4 py-2 rounded-full shadow-sm">
                <i class="fa-solid fa-circle-check text-green-500 mr-1"></i> Live Data Sync
            </div>
        </div>
        
        <!-- Summary Dashboard -->
        <div class="bg-white md:rounded-xl shadow-lg border-x border-t md:border-slate-200 border-transparent overflow-hidden mb-8 responsive-table">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse md:table-fixed" id="summaryTable">
                    <thead>
                        <tr class="bg-slate-800 text-slate-100 uppercase text-xs font-semibold tracking-wider">
                            <th class="p-4 text-left rounded-tl-lg w-[14%] whitespace-nowrap overflow-hidden text-ellipsis">Asset (Key)</th>
                            <th class="p-4 text-center w-[8%] whitespace-nowrap overflow-hidden text-ellipsis">Rank</th>
                            <th class="p-4 w-[13%] whitespace-nowrap overflow-hidden text-ellipsis">Investment ($)</th>
                            <th class="p-4 w-[13%] whitespace-nowrap overflow-hidden text-ellipsis">Cash-out ($)</th>
                            <th class="p-4 w-[13%] whitespace-nowrap overflow-hidden text-ellipsis">Pending ($)</th>
                            <th class="p-4 w-[14%] whitespace-nowrap overflow-hidden text-ellipsis">TOTAL REVENUE ($)</th>
                            <th class="p-4 w-[13%] whitespace-nowrap overflow-hidden text-ellipsis">NET PROFIT ($)</th>
                            <th class="p-4 rounded-tr-lg w-[12%] whitespace-nowrap overflow-hidden text-ellipsis">ROI (%)</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm font-medium" id="summaryBody">
                        <tr><td colspan="8" class="p-4 text-center text-slate-500">Đang tải dữ liệu...</td></tr>
                    </tbody>
                    <tfoot class="bg-slate-50 font-bold text-slate-900 border-t-2 border-slate-300" id="summaryFooter">
                        <!-- Total row injected here -->
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = '1wyXOB7wktDBG1BeNn_YEiHL4d63R1lKcAoHxcP2hJF8';
        const GID = '0';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}`; 

        // CẤU HÌNH VỐN ĐẦU TƯ CHO TỪNG COIN (Investment)
        const INVESTMENTS = {
            'BTC': 18000,
            'ETH': 18000,
            'ENA': 14000,
            'AVAX': 15000,
            'LINK': 11000,
            'SUI': 1000
        };

        // MAPPING KÝ HIỆU COIN SANG ID COINGECKO
        const COINGECKO_MAP = {
            'BTC': 'bitcoin',
            'ETH': 'ethereum',
            'ENA': 'ethena',
            'AVAX': 'avalanche-2',
            'LINK': 'chainlink',
            'SUI': 'sui'
        };

        let globalData = []; 
        let liveData = {}; // Store price and rank

        async function initDashboard() {
            try {
                // Lấy giá Live và Rank từ CoinGecko (vì Binance không có Rank)
                const ids = Object.values(COINGECKO_MAP).join(',');
                const url = `https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}`;
                const res = await fetch(url);
                const tickerData = await res.json();
                
                // Map lại vào object theo symbol gốc
                tickerData.forEach(item => {
                    const symbol = Object.keys(COINGECKO_MAP).find(key => COINGECKO_MAP[key] === item.id);
                    if (symbol) {
                        liveData[symbol] = {
                            price: parseFloat(item.current_price),
                            rank: item.market_cap_rank
                        };
                    }
                });
            } catch (err) {
                console.warn("Không thể tải giá live & rank từ CoinGecko:", err);
            }

            // Parse Google Sheet CSV sau khi có giá & rank
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    if(data && data.length > 0) {
                        globalData = data.filter(row => Object.values(row).some(val => val && val.trim() !== ''));
                        processSummary(globalData);
                    } else {
                        document.getElementById('summaryBody').innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500">Không có dữ liệu</td></tr>`;
                    }
                },
                error: function(err) {
                    document.getElementById('summaryBody').innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500">Lỗi khi tải dữ liệu: ${err.message}</td></tr>`;
                }
            });
        }

        function formatMoney(amount, forceDecimals = false) {
            if (amount === undefined || amount === null) return '-';
            const options = { minimumFractionDigits: 0, maximumFractionDigits: 4 };
            if (forceDecimals && amount < 10) options.minimumFractionDigits = 2; // Show decimals for small prices
            return '$' + amount.toLocaleString('en-US', options);
        }

        function parseMoney(str) {
            if (!str) return 0;
            return parseFloat(str.replace(/[\$\,]/g, '')) || 0;
        }

        function getStatusBadge(statusText) {
            if (!statusText) return '-';
            if (statusText.includes('Filled')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800 border border-green-200">${statusText}</span>`;
            } else if (statusText.includes('Pending')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-amber-100 text-amber-800 border border-amber-200">${statusText}</span>`;
            }
            return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-200 text-slate-800">${statusText}</span>`;
        }

        function processSummary(data) {
            const summary = {};

            data.forEach(row => {
                const coin = row['COIN'] ? row['COIN'].trim() : null;
                if (!coin) return;

                if (!summary[coin]) {
                    summary[coin] = {
                        asset: coin,
                        rank: liveData[coin] ? liveData[coin].rank : 9999, // default to high rank if not found
                        investment: INVESTMENTS[coin] || 0,
                        cashOut: 0,
                        pending: 0,
                        details: []
                    };
                }

                summary[coin].details.push(row);

                // --- LOGIC TÍNH TỔNG CỘT AMOUNT THEO STATUS ---
                const amount = parseMoney(row['AMOUNT']);
                const status = row['STATUS'] || '';

                if (status.includes('Filled')) {
                    summary[coin].cashOut += amount;
                } else if (status.includes('Pending')) {
                    summary[coin].pending += amount;
                }
            });

            let totalInvestment = 0;
            let totalCashOut = 0;
            let totalPending = 0;
            let totalRevenueSum = 0;
            let totalNetProfit = 0;

            const summaryList = Object.values(summary).map(item => {
                // Total Revenue = Cash-Out + Pending
                item.totalRevenue = item.cashOut + item.pending;
                item.netProfit = item.totalRevenue - item.investment;
                item.roi = item.investment > 0 ? (item.netProfit / item.investment) : 0;

                totalInvestment += item.investment;
                totalCashOut += item.cashOut;
                totalPending += item.pending;
                totalRevenueSum += item.totalRevenue;
                totalNetProfit += item.netProfit;

                return item;
            });
            
            // SẮP XẾP THEO RANK (Tăng dần)
            summaryList.sort((a, b) => a.rank - b.rank);

            const totalROI = totalInvestment > 0 ? (totalNetProfit / totalInvestment) : 0;

            renderSummary(summaryList, {
                totalInvestment, totalCashOut, totalPending, totalRevenueSum, totalNetProfit, totalROI
            });
            
            // Phục hồi trạng thái mở của dòng chi tiết
            if (expandedCoinId) {
                const mainRow = document.getElementById(`row-${expandedCoinId}`);
                if (mainRow) {
                    mainRow.classList.add('expanded-row');
                    document.querySelectorAll(`.detail-${expandedCoinId}`).forEach(r => r.classList.remove('hidden-row'));
                }
            }
        }

        let expandedCoinId = null;
        
        function toggleRow(coinId) {
            const mainRow = document.getElementById(`row-${coinId}`);
            const detailRows = document.querySelectorAll(`.detail-${coinId}`);
            
            if (mainRow.classList.contains('expanded-row')) {
                mainRow.classList.remove('expanded-row');
                detailRows.forEach(r => r.classList.add('hidden-row'));
                if (expandedCoinId === coinId) expandedCoinId = null;
            } else {
                // Tự động đóng các accordion khác
                document.querySelectorAll('.expanded-row').forEach(row => row.classList.remove('expanded-row'));
                document.querySelectorAll('.detail-row').forEach(row => row.classList.add('hidden-row'));
                
                mainRow.classList.add('expanded-row');
                detailRows.forEach(r => r.classList.remove('hidden-row'));
                expandedCoinId = coinId;
            }
        }

        function renderSummary(summaryList, totals) {
            const tbody = document.getElementById('summaryBody');
            const tfoot = document.getElementById('summaryFooter');
            tbody.innerHTML = '';

            summaryList.forEach((item, index) => {
                const coinId = item.asset.replace(/\s+/g, '-');
                
                // --- 1. Hàng Summary (Main Row) ---
                const tr = document.createElement('tr');
                tr.className = 'clickable-row group';
                tr.id = `row-${coinId}`;
                tr.onclick = () => toggleRow(coinId);
                
                tr.innerHTML = `
                    <td data-label="Asset" class="p-4 text-left font-bold text-blue-600 group-hover:text-blue-800 flex items-center gap-3">
                        <i class="fa-solid fa-chevron-down text-slate-400 text-[10px] chevron-icon hidden md:block"></i>
                        ${item.asset}
                    </td>
                    <td data-label="Rank" class="p-4 text-center text-slate-500 font-mono text-xs">${item.rank !== 9999 ? '#' + item.rank : '-'}</td>
                    <td data-label="Investment" class="p-4 text-slate-600">${formatMoney(item.investment)}</td>
                    <td data-label="Cash-out" class="p-4 font-semibold text-green-600">${formatMoney(item.cashOut)}</td>
                    <td data-label="Pending" class="p-4 font-semibold text-amber-500">${formatMoney(item.pending)}</td>
                    <td data-label="Total Revenue" class="p-4 font-bold text-slate-800">${formatMoney(item.totalRevenue)}</td>
                    <td data-label="Net Profit" class="p-4 font-bold ${item.netProfit >= 0 ? 'text-green-600' : 'text-red-500'}">${formatMoney(item.netProfit)}</td>
                    <td data-label="ROI" class="p-4 font-bold ${item.roi >= 0 ? 'text-green-600' : 'text-red-500'}">${(item.roi * 100).toFixed(0)}%</td>
                `;
                tbody.appendChild(tr);

                // --- 2. Hàng Detail (Dropdown Rows) ---
                const currentPrice = liveData[item.asset] ? liveData[item.asset].price : null;
                
                // Thêm dòng tiêu đề cho phần chi tiết
                if (item.details.length > 0) {
                    const headerTr = document.createElement('tr');
                    headerTr.className = `detail-row detail-${coinId} hidden-row bg-slate-200/50 text-slate-500 uppercase text-[10px] font-bold tracking-wider hidden md:table-row`;
                    headerTr.innerHTML = `
                        <td class="py-2 px-4 text-center border-l-2 border-blue-400">Status</td>
                        <td class="py-2 px-4 text-left">Phase</td>
                        <td class="py-2 px-4 text-right">Rationale</td>
                        <td class="py-2 px-4 text-right">Amount</td>
                        <td class="py-2 px-4 text-right">Live Price</td>
                        <td class="py-2 px-4 text-right">Target $</td>
                        <td class="py-2 px-4 text-right">Quantity</td>
                        <td class="py-2 px-4 text-right">Ratio</td>
                    `;
                    tbody.appendChild(headerTr);
                }

                item.details.forEach((detail, idx) => {
                    const targetVal = parseMoney(detail['TARGET $']);
                    let priceColorClass = 'text-blue-600';
                    if (currentPrice && targetVal > 0) {
                        const diff = (currentPrice - targetVal) / targetVal;
                        // Nổi bật nếu giá Live >= 95% Target (tiệm cận hoặc đã vượt)
                        if (diff >= -0.05) {
                            priceColorClass = 'text-green-500 font-bold';
                        }
                    }

                    const detailTr = document.createElement('tr');
                    detailTr.className = `detail-row detail-${coinId} hidden-row transition-opacity hover:bg-slate-100 cursor-pointer`;
                    detailTr.title = "Click để chuyển đổi trạng thái Pending/Filled";
                    detailTr.onclick = () => {
                        const currentStatus = detail['STATUS'] || '';
                        if (currentStatus.includes('Pending')) {
                            detail['STATUS'] = currentStatus.replace('Pending', 'Filled');
                        } else if (currentStatus.includes('Filled')) {
                            detail['STATUS'] = currentStatus.replace('Filled', 'Pending');
                        }
                        // Render lại bảng với data mới
                        processSummary(globalData);
                    };
                    
                    detailTr.innerHTML = `
                        <td data-label="Status" class="p-4 text-center border-l-2 border-blue-400 truncate">${getStatusBadge(detail['STATUS'])}</td>
                        <td data-label="Phase" class="p-4 text-left text-slate-600 font-medium text-xs md:text-sm truncate" title="${detail['PHASE'] || ''}">${detail['PHASE'] || '-'}</td>
                        <td data-label="Rationale" class="p-4 text-slate-500 text-xs text-right truncate" title="${detail['PRICING RATIONALE'] || ''}">${detail['PRICING RATIONALE'] || '-'}</td>
                        <td data-label="Amount" class="p-4 font-bold text-right text-slate-800 truncate">${detail['AMOUNT'] || '-'}</td>
                        <td data-label="Live Price" class="p-4 font-medium text-right ${priceColorClass} truncate">${formatMoney(currentPrice, true)}</td>
                        <td data-label="Target $" class="p-4 font-medium text-right text-slate-700 truncate">${detail['TARGET $'] || '-'}</td>
                        <td data-label="Quantity" class="p-4 text-slate-500 text-right truncate">${detail['QUANTITY'] || '-'}</td>
                        <td data-label="Ratio" class="p-4 text-slate-500 text-right font-semibold truncate">${detail['RATIO'] || '-'}</td>
                    `;
                    tbody.appendChild(detailTr);
                });
            });

            // --- 3. Tfoot Total ---
            tfoot.innerHTML = `
                <tr>
                    <td data-label="Tổng kết" class="p-4 text-left text-lg md:font-bold">TOTAL</td>
                    <td data-label="Rank" class="p-4 text-center hidden md:table-cell">-</td>
                    <td data-label="Investment" class="p-4">${formatMoney(totals.totalInvestment)}</td>
                    <td data-label="Cash-out" class="p-4">${formatMoney(totals.totalCashOut)}</td>
                    <td data-label="Pending" class="p-4">${formatMoney(totals.totalPending)}</td>
                    <td data-label="Total Revenue" class="p-4">${formatMoney(totals.totalRevenueSum)}</td>
                    <td data-label="Net Profit" class="p-4 ${totals.totalNetProfit >= 0 ? 'text-green-600' : 'text-red-500'}">${formatMoney(totals.totalNetProfit)}</td>
                    <td data-label="ROI" class="p-4 ${totals.totalROI >= 0 ? 'text-green-600' : 'text-red-500'}">${(totals.totalROI * 100).toFixed(0)}%</td>
                </tr>
            `;
        }
        
        // Khởi chạy
        initDashboard();
    </script>
</body>
</html>
