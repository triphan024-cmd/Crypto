<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Add FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-4 md:p-8 min-h-screen">
    <div class="max-w-7xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-bold text-slate-800 flex items-center gap-3">
                <i class="fa-solid fa-chart-line text-blue-600"></i>
                Crypto Trading Dashboard
            </h1>
            <div class="text-sm text-slate-500 bg-white px-4 py-2 rounded-full shadow-sm">
                <i class="fa-solid fa-circle-check text-green-500 mr-1"></i> Live Data Sync
            </div>
        </div>
        
        <div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse whitespace-nowrap" id="dashboardTable">
                    <thead>
                        <tr class="bg-slate-800 text-slate-100 uppercase text-xs font-semibold tracking-wider" id="tableHeader">
                            <th class="p-4 rounded-tl-lg">Đang tải dữ liệu...</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm" id="tableBody">
                        <!-- Data rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH CSV URL ---
        // Sử dụng link export format=csv thay vì link edit
        const SPREADSHEET_ID = '1wyXOB7wktDBG1BeNn_YEiHL4d63R1lKcAoHxcP2hJF8';
        const GID = '0';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}`; 
        
        // Tải và Parse dữ liệu
        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            complete: function(results) {
                const data = results.data;
                if(data && data.length > 0) {
                    renderTable(data);
                } else {
                    showError("Không có dữ liệu hoặc lỗi parse.");
                }
            },
            error: function(err) {
                showError("Lỗi khi tải dữ liệu: " + err.message);
            }
        });

        // Hàm render màu sắc cho Status
        function getStatusBadge(statusText) {
            if (!statusText) return '-';
            if (statusText.includes('Filled')) {
                return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 border border-green-200">
                            ${statusText}
                        </span>`;
            } else if (statusText.includes('Pending')) {
                return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800 border border-amber-200">
                            ${statusText}
                        </span>`;
            }
            return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800">
                        ${statusText}
                    </span>`;
        }
        
        // Hàm render Logo Coin
        function getCoinBadge(coin) {
            if (!coin) return '-';
            // Simple hash to generate a somewhat consistent color for coins
            const colors = ['bg-blue-100 text-blue-700', 'bg-indigo-100 text-indigo-700', 'bg-purple-100 text-purple-700', 'bg-pink-100 text-pink-700', 'bg-orange-100 text-orange-700'];
            const colorIndex = coin.length % colors.length;
            const colorClass = colors[colorIndex];
            
            return `<span class="font-bold ${colorClass} px-2 py-1 rounded-md text-xs border border-opacity-20 border-current shadow-sm">${coin}</span>`;
        }

        function renderTable(data) {
            const headerRow = document.getElementById('tableHeader');
            const tbody = document.getElementById('tableBody');
            
            headerRow.innerHTML = '';
            tbody.innerHTML = '';

            // Clean headers (remove any empty strings)
            let rawHeaders = Object.keys(data[0]);
            const headers = rawHeaders.filter(h => h.trim() !== '');

            if (headers.length === 0) return;

            // Render headers
            headers.forEach(headerText => {
                const th = document.createElement('th');
                th.className = 'p-4';
                th.textContent = headerText;
                headerRow.appendChild(th);
            });

            // Render rows
            data.forEach(row => {
                // Skip completely empty rows
                if (headers.every(h => !row[h] || row[h].trim() === '')) return;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-blue-50 transition-colors duration-150 group';
                
                headers.forEach(header => {
                    const td = document.createElement('td');
                    td.className = 'p-4 text-slate-700 align-middle group-hover:text-slate-900';
                    
                    const value = row[header] ? row[header].trim() : '-';
                    
                    // Custom formatting based on column name
                    if (header.toUpperCase() === 'STATUS') {
                        td.innerHTML = getStatusBadge(value);
                    } else if (header.toUpperCase() === 'COIN') {
                        td.innerHTML = getCoinBadge(value);
                    } else if (header.toUpperCase() === 'AMOUNT' || header.toUpperCase().includes('TARGET')) {
                        td.innerHTML = `<span class="font-medium text-slate-800">${value}</span>`;
                    } else if (header.toUpperCase() === 'ID') {
                        td.innerHTML = `<span class="text-slate-500 text-xs font-mono">${value}</span>`;
                    } else {
                        td.textContent = value;
                    }
                    
                    tr.appendChild(td);
                });
                
                tbody.appendChild(tr);
            });
        }

        function showError(msg) {
            document.getElementById('tableHeader').innerHTML = `<th class="p-4 text-red-400"><i class="fa-solid fa-triangle-exclamation mr-2"></i> Lỗi</th>`;
            document.getElementById('tableBody').innerHTML = `<tr><td class="p-4 text-slate-600 bg-red-50">${msg}</td></tr>`;
        }
    </script>
</body>
</html>
