<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .clickable-row { cursor: pointer; transition: background-color 0.2s, border-color 0.2s; border-bottom: 1px solid #f1f5f9; }
        .clickable-row:hover { background-color: #f8fafc; }
        .expanded-row { background-color: #f8fafc; border-bottom-color: transparent !important; }
        
        .detail-row {
            background-color: #f8fafc;
            border-bottom: 1px solid #f1f5f9;
        }
        .detail-row td { padding-top: 0.75rem !important; padding-bottom: 0.75rem !important; }
        .detail-row.hidden-row { display: none !important; }
        
        .chevron-icon { transition: transform 0.3s ease; }
        .expanded-row .chevron-icon { transform: rotate(180deg); }
        
        /* Sticky styles for horizontal scrolling on mobile */
        .sticky-col {
            position: sticky !important;
            left: 0;
            z-index: 10;
            box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1);
        }
        thead .sticky-col {
            z-index: 20; /* Ensure header stays above rows */
        }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8 min-h-screen text-slate-800">
    
    <!-- Màn hình Đăng Nhập -->
    <div id="loginOverlay" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full mx-4">
            <h2 class="text-2xl font-bold mb-6 text-center text-slate-800">
                <i class="fa-solid fa-lock text-blue-600 mr-2"></i> Security
            </h2>
            <div class="mb-4">
                <input type="password" id="passInput" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nhập mật khẩu..." onkeypress="if(event.key === 'Enter') checkPassword()" autofocus>
            </div>
            <p id="loginError" class="text-red-500 text-sm mb-4 hidden text-center font-medium"><i class="fa-solid fa-circle-exclamation mr-1"></i> Sai mật khẩu!</p>
            <button onclick="checkPassword()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                Xác Nhận
            </button>
        </div>
    </div>

    <!-- Nội dung App (Bị ẩn lúc đầu) -->
    <div id="appContent" class="max-w-7xl mx-auto hidden">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-bold flex items-center gap-3">
                <i class="fa-solid fa-chart-pie text-blue-600"></i>
                <span class="hidden md:inline">Portfolio Summary</span>
                <span class="md:hidden">Portfolio</span>
            </h1>
            <div class="flex items-center gap-3">
                <button onclick="refreshData()" class="text-sm bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-2 md:px-4 md:py-2 rounded-full shadow-sm font-medium transition-colors border border-blue-200 flex items-center">
                    <i class="fa-solid fa-arrows-rotate mr-1" id="refreshIcon"></i> Sync
                </button>
            </div>
        </div>
        
        <!-- Summary Dashboard -->
        <div class="bg-white md:rounded-xl shadow-lg border-x border-t md:border-slate-200 border-transparent overflow-hidden mb-8">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse md:table-fixed" id="summaryTable">
                    <thead>
                        <tr class="bg-slate-800 text-slate-100 uppercase text-xs font-semibold tracking-wider">
                            <th class="p-4 text-left rounded-tl-lg w-[14%] whitespace-nowrap overflow-hidden text-ellipsis sticky-col bg-slate-800">Asset</th>
                            <th class="p-4 text-center w-[8%] whitespace-nowrap overflow-hidden text-ellipsis">Rank</th>
                            <th class="p-4 w-[13%] whitespace-nowrap overflow-hidden text-ellipsis">Invested</th>
                            <th class="p-4 w-[13%] whitespace-nowrap overflow-hidden text-ellipsis">Filled</th>
                            <th class="p-4 w-[13%] whitespace-nowrap overflow-hidden text-ellipsis">Pending</th>
                            <th class="p-4 w-[14%] whitespace-nowrap overflow-hidden text-ellipsis">Revenue</th>
                            <th class="p-4 w-[13%] whitespace-nowrap overflow-hidden text-ellipsis">Profit</th>
                            <th class="p-4 rounded-tr-lg w-[12%] whitespace-nowrap overflow-hidden text-ellipsis">ROI</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm font-medium" id="summaryBody">
                        <tr><td colspan="8" class="p-4 text-center text-slate-500">Đang tải dữ liệu...</td></tr>
                    </tbody>
                    <tfoot class="bg-slate-50 font-bold text-slate-900 border-t-2 border-slate-300" id="summaryFooter">
                        <!-- Total row injected here -->
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- SECURITY ---
        const E_SID = "eRgVPCowBRoEGyoKKF0mADxcMjYqBwAjWABTQWBcAyQNCQAkHAYiAAUlKVY=";
        const E_GAS = "IBsYFBZIHUIcDBwhHxhKAh1dCgMKQCsAAUsIE1EfABxBO0AtLwMLUQ8XWAgEORUjCxRnKhwYOyM4GTEHGmhUOiAcKwYaJwMBBSs2QlYQQg4DVD9dIzpaBgsaAxEtOHcoAVgoOAJBCihAVAcNPkEtFwkH";
        const E_INV = "M00uMCZQCFxXX154Q04hMToQV15XXnhfQEYgPHNPVV5aeF9cSEczZCw3TVR5WlxUVV4QISYhJWpVXVVVQgJBTTw7AU1WVVVCAhA=";
        const GID = '0';
        
        let SPREADSHEET_ID = '';
        let GAS_URL = '';
        let CSV_URL = '';
        let INVESTMENTS = {};

        function decrypt(b64, key) {
            const raw = atob(b64);
            let res = '';
            for(let i=0; i<raw.length; i++){
                res += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return res;
        }

        function checkPassword(autoPw = null) {
            const pw = autoPw || document.getElementById('passInput').value;
            try {
                SPREADSHEET_ID = decrypt(E_SID, pw);
                GAS_URL = decrypt(E_GAS, pw);
                const invStr = decrypt(E_INV, pw);
                INVESTMENTS = JSON.parse(invStr);
                
                // Nếu JSON.parse không báo lỗi nghĩa là parse đúng -> password đúng
                CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}`;
                
                // Lưu vào Session (Mất khi đóng Tab) - Giúp không phải nhập lại khi F5
                sessionStorage.setItem('crypto_pw', pw);
                
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                
                initDashboard();
            } catch (err) {
                if (!autoPw) {
                    document.getElementById('loginError').classList.remove('hidden');
                } else {
                    // Xóa nếu session bị lỗi
                    sessionStorage.removeItem('crypto_pw');
                }
            }
        }

        // Tự động kiểm tra session khi tải trang
        window.addEventListener('DOMContentLoaded', () => {
            const savedPw = sessionStorage.getItem('crypto_pw');
            if (savedPw) {
                checkPassword(savedPw);
            }
        });

        // MAPPING KÝ HIỆU COIN SANG ID COINGECKO
        const COINGECKO_MAP = {
            'BTC': 'bitcoin',
            'ETH': 'ethereum',
            'ENA': 'ethena',
            'AVAX': 'avalanche-2',
            'LINK': 'chainlink',
            'SUI': 'sui'
        };

        let globalData = []; 
        let liveData = {}; // Store price and rank

        async function fetchPrices() {
            try {
                const ids = Object.values(COINGECKO_MAP).join(',');
                const url = `https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}`;
                const res = await fetch(url);
                const tickerData = await res.json();
                
                tickerData.forEach(item => {
                    const symbol = Object.keys(COINGECKO_MAP).find(key => COINGECKO_MAP[key] === item.id);
                    if (symbol) {
                        liveData[symbol] = {
                            price: parseFloat(item.current_price),
                            rank: item.market_cap_rank
                        };
                    }
                });
                return true;
            } catch (err) {
                console.warn("Lỗi tải giá từ CoinGecko:", err);
                return false;
            }
        }

        async function fetchAndParseData(callback) {
            const noCacheUrl = CSV_URL + "&t=" + new Date().getTime(); // Prevent browser caching
            
            Papa.parse(noCacheUrl, {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    if(data && data.length > 0) {
                        globalData = data.filter(row => Object.values(row).some(val => val && val.trim() !== ''));
                        processSummary(globalData);
                    } else {
                        document.getElementById('summaryBody').innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500">Không có dữ liệu</td></tr>`;
                    }
                    if (callback) callback();
                },
                error: function(err) {
                    document.getElementById('summaryBody').innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500">Lỗi khi tải dữ liệu: ${err.message}</td></tr>`;
                    if (callback) callback();
                }
            });
        }

        async function initDashboard() {
            await fetchPrices();
            fetchAndParseData();
        }

        async function refreshData() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('fa-spin'); // spin animation
            
            await fetchPrices(); // update crypto prices
            fetchAndParseData(() => {
                setTimeout(() => icon.classList.remove('fa-spin'), 500); // stop spin when both prices and sheet are loaded
            });
        }

        function formatMoney(amount, forceDecimals = false) {
            if (amount === undefined || amount === null) return '-';
            const options = { minimumFractionDigits: 0, maximumFractionDigits: 4 };
            if (forceDecimals && amount < 10) options.minimumFractionDigits = 2; // Show decimals for small prices
            return '$' + amount.toLocaleString('en-US', options);
        }

        function parseMoney(str) {
            if (!str) return 0;
            return parseFloat(str.replace(/[\$\,]/g, '')) || 0;
        }

        function getStatusBadge(statusText) {
            if (!statusText) return '-';
            if (statusText.includes('Filled')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800 border border-green-200">${statusText}</span>`;
            } else if (statusText.includes('Pending')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-amber-100 text-amber-800 border border-amber-200">${statusText}</span>`;
            }
            return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-200 text-slate-800">${statusText}</span>`;
        }

        function processSummary(data) {
            const summary = {};

            data.forEach(row => {
                const coin = row['COIN'] ? row['COIN'].trim() : null;
                if (!coin) return;

                if (!summary[coin]) {
                    summary[coin] = {
                        asset: coin,
                        rank: liveData[coin] ? liveData[coin].rank : 9999, // default to high rank if not found
                        investment: INVESTMENTS[coin] || 0,
                        cashOut: 0,
                        pending: 0,
                        details: []
                    };
                }

                summary[coin].details.push(row);

                // --- LOGIC TÍNH TỔNG CỘT AMOUNT THEO STATUS ---
                const amount = parseMoney(row['AMOUNT']);
                const status = row['STATUS'] || '';

                if (status.includes('Filled')) {
                    summary[coin].cashOut += amount;
                } else if (status.includes('Pending')) {
                    summary[coin].pending += amount;
                }
            });

            let totalInvestment = 0;
            let totalCashOut = 0;
            let totalPending = 0;
            let totalRevenueSum = 0;
            let totalNetProfit = 0;

            const summaryList = Object.values(summary).map(item => {
                // Total Revenue = Cash-Out + Pending
                item.totalRevenue = item.cashOut + item.pending;
                item.netProfit = item.totalRevenue - item.investment;
                item.roi = item.investment > 0 ? (item.netProfit / item.investment) : 0;

                totalInvestment += item.investment;
                totalCashOut += item.cashOut;
                totalPending += item.pending;
                totalRevenueSum += item.totalRevenue;
                totalNetProfit += item.netProfit;

                return item;
            });
            
            // SẮP XẾP THEO RANK (Tăng dần)
            summaryList.sort((a, b) => a.rank - b.rank);

            const totalROI = totalInvestment > 0 ? (totalNetProfit / totalInvestment) : 0;

            renderSummary(summaryList, {
                totalInvestment, totalCashOut, totalPending, totalRevenueSum, totalNetProfit, totalROI
            });
            
            // Phục hồi trạng thái mở của dòng chi tiết
            if (expandedCoinId) {
                const mainRow = document.getElementById(`row-${expandedCoinId}`);
                if (mainRow) {
                    mainRow.classList.add('expanded-row');
                    document.querySelectorAll(`.detail-${expandedCoinId}`).forEach(r => r.classList.remove('hidden-row'));
                }
            }
        }

        let expandedCoinId = null;
        
        function toggleRow(coinId) {
            const mainRow = document.getElementById(`row-${coinId}`);
            const detailRows = document.querySelectorAll(`.detail-${coinId}`);
            
            if (mainRow.classList.contains('expanded-row')) {
                mainRow.classList.remove('expanded-row');
                detailRows.forEach(r => r.classList.add('hidden-row'));
                if (expandedCoinId === coinId) expandedCoinId = null;
            } else {
                // Tự động đóng các accordion khác
                document.querySelectorAll('.expanded-row').forEach(row => row.classList.remove('expanded-row'));
                document.querySelectorAll('.detail-row').forEach(row => row.classList.add('hidden-row'));
                
                mainRow.classList.add('expanded-row');
                detailRows.forEach(r => r.classList.remove('hidden-row'));
                expandedCoinId = coinId;
            }
        }

        function renderSummary(summaryList, totals) {
            const tbody = document.getElementById('summaryBody');
            const tfoot = document.getElementById('summaryFooter');
            tbody.innerHTML = '';

            summaryList.forEach((item, index) => {
                const coinId = item.asset.replace(/\s+/g, '-');
                
                // --- 1. Hàng Summary (Main Row) ---
                const tr = document.createElement('tr');
                tr.className = 'clickable-row group';
                tr.id = `row-${coinId}`;
                tr.onclick = () => toggleRow(coinId);
                
                tr.innerHTML = `
                    <td data-label="Asset" class="p-4 text-left font-bold text-blue-600 group-hover:text-blue-800 flex items-center gap-3 sticky-col bg-white transition-colors">
                        <i class="fa-solid fa-chevron-down text-slate-400 text-[10px] chevron-icon hidden md:block"></i>
                        ${item.asset}
                    </td>
                    <td data-label="Rank" class="p-4 text-center text-slate-500 font-mono text-xs">${item.rank !== 9999 ? '#' + item.rank : '-'}</td>
                    <td data-label="Invested" class="p-4 text-slate-600">${formatMoney(item.investment)}</td>
                    <td data-label="Filled" class="p-4 font-semibold text-green-600">${formatMoney(item.cashOut)}</td>
                    <td data-label="Pending" class="p-4 font-semibold text-amber-500">${formatMoney(item.pending)}</td>
                    <td data-label="Revenue" class="p-4 font-bold text-slate-800">${formatMoney(item.totalRevenue)}</td>
                    <td data-label="Profit" class="p-4 font-bold ${item.netProfit >= 0 ? 'text-green-600' : 'text-red-500'}">${formatMoney(item.netProfit)}</td>
                    <td data-label="ROI" class="p-4 font-bold ${item.roi >= 0 ? 'text-green-600' : 'text-red-500'}">${(item.roi * 100).toFixed(0)}%</td>
                `;
                tbody.appendChild(tr);

                // --- 2. Hàng Detail (Dropdown Rows) ---
                const currentPrice = liveData[item.asset] ? liveData[item.asset].price : null;
                
                // Thêm dòng tiêu đề cho phần chi tiết
                if (item.details.length > 0) {
                    const headerTr = document.createElement('tr');
                    headerTr.className = `detail-row detail-${coinId} hidden-row bg-slate-200/50 text-slate-500 uppercase text-[10px] font-bold tracking-wider hidden md:table-row`;
                    headerTr.innerHTML = `
                        <td class="py-2 pr-4 pl-[38px] text-left border-l-2 border-blue-400 sticky-col bg-slate-100">Status</td>
                        <td class="py-2 px-4 text-left">Phase</td>
                        <td class="py-2 px-4 text-right">Reason</td>
                        <td class="py-2 px-4 text-right">Amount</td>
                        <td class="py-2 px-4 text-right">Price</td>
                        <td class="py-2 px-4 text-right">Target</td>
                        <td class="py-2 px-4 text-right">Qty</td>
                        <td class="py-2 px-4 text-right">Ratio</td>
                    `;
                    tbody.appendChild(headerTr);
                }

                item.details.forEach((detail, idx) => {
                    const targetVal = parseMoney(detail['TARGET $']);
                    let priceColorClass = 'text-blue-600';
                    if (currentPrice && targetVal > 0) {
                        const diff = (currentPrice - targetVal) / targetVal;
                        // Nổi bật nếu giá Live >= 95% Target (tiệm cận hoặc đã vượt)
                        if (diff >= -0.05) {
                            priceColorClass = 'text-green-500 font-bold';
                        }
                    }

                    const detailTr = document.createElement('tr');
                    detailTr.className = `detail-row detail-${coinId} hidden-row transition-opacity hover:bg-slate-200 cursor-pointer`;
                    detailTr.title = "Click để chuyển đổi trạng thái Pending/Filled và cập nhật lên Google Sheet";
                    detailTr.onclick = async () => {
                        const currentStatus = detail['STATUS'] || '';
                        let newStatus = currentStatus;
                        
                        if (currentStatus.includes('Pending')) {
                            newStatus = '✅ Filled';
                        } else if (currentStatus.includes('Filled')) {
                            newStatus = '⏳ Pending';
                        }
                        
                        // Update local data for immediate UI response
                        detail['STATUS'] = newStatus;
                        processSummary(globalData);
                        
                        // Sync to Google Sheet if GAS_URL is configured
                        if (GAS_URL && GAS_URL !== "DÁN_URL_CỦA_BẠN_VÀO_ĐÂY") {
                            try {
                                await fetch(GAS_URL, {
                                    method: 'POST',
                                    mode: 'no-cors',
                                    headers: {
                                        'Content-Type': 'text/plain',
                                    },
                                    body: JSON.stringify({
                                        id: detail['ID'],
                                        status: newStatus
                                    })
                                });
                                console.log("Đã gửi lệnh cập nhật lên Google Sheet.");
                            } catch (error) {
                                console.error("Lỗi khi đồng bộ Google Sheet:", error);
                            }
                        }
                    };
                    
                    detailTr.innerHTML = `
                        <td data-label="Status" class="py-4 pr-4 pl-[38px] text-left border-l-2 border-blue-400 truncate sticky-col bg-slate-50 transition-colors group-hover:bg-slate-200">${getStatusBadge(detail['STATUS'])}</td>
                        <td data-label="Phase" class="p-4 text-left text-slate-600 font-medium text-xs md:text-sm truncate" title="${detail['PHASE'] || ''}">${detail['PHASE'] || '-'}</td>
                        <td data-label="Reason" class="p-4 text-slate-500 text-xs text-right truncate" title="${detail['RATIONALE'] || ''}">${detail['RATIONALE'] || '-'}</td>
                        <td data-label="Amount" class="p-4 font-bold text-right text-slate-800 truncate">${detail['AMOUNT'] || '-'}</td>
                        <td data-label="Price" class="p-4 font-medium text-right ${priceColorClass} truncate">${formatMoney(currentPrice, true)}</td>
                        <td data-label="Target" class="p-4 font-medium text-right text-slate-700 truncate">${detail['TARGET $'] || '-'}</td>
                        <td data-label="Qty" class="p-4 text-slate-500 text-right truncate">${detail['QUANTITY'] || '-'}</td>
                        <td data-label="Ratio" class="p-4 text-slate-500 text-right font-semibold truncate">${detail['RATIO'] || '-'}</td>
                    `;
                    tbody.appendChild(detailTr);
                });
            });

            // --- 3. Tfoot Total ---
            tfoot.innerHTML = `
                <tr>
                    <td data-label="TOTAL" class="p-4 text-left text-lg md:font-bold sticky-col bg-slate-50">TOTAL</td>
                    <td data-label="Rank" class="p-4 text-center hidden md:table-cell">-</td>
                    <td data-label="Invested" class="p-4">${formatMoney(totals.totalInvestment)}</td>
                    <td data-label="Filled" class="p-4">${formatMoney(totals.totalCashOut)}</td>
                    <td data-label="Pending" class="p-4">${formatMoney(totals.totalPending)}</td>
                    <td data-label="Revenue" class="p-4">${formatMoney(totals.totalRevenueSum)}</td>
                    <td data-label="Profit" class="p-4 ${totals.totalNetProfit >= 0 ? 'text-green-600' : 'text-red-500'}">${formatMoney(totals.totalNetProfit)}</td>
                    <td data-label="ROI" class="p-4 ${totals.totalROI >= 0 ? 'text-green-600' : 'text-red-500'}">${(totals.totalROI * 100).toFixed(0)}%</td>
                </tr>
            `;
        }
        
        // Bỏ khởi chạy tự động để chờ màn hình đăng nhập
    </script>
</body>
</html>
